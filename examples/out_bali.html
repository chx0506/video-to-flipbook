<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Flipbook · 交互图鉴</title>
<style>
    /* ===== VERSO Cold Luxury 主题（对齐 APP IP · 海军蓝 + 银雾）===== */
  :root{
    --paper:#f2f4f7;--ink:#1a3350;--muted:#7a8690;--line:#d5dee8;
    --accent:#1f3a4a;--sage:#3d6a82;--bg1:#eef3f8;--bg2:#e0eaf2;--stage:#e8eef4;
    --radius:22px;--radius-pill:22px;--shadow:0 14px 36px -16px rgba(31,58,74,.22);
    --topbar-h:59px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  /* travel 默认走 VERSO 冷雾；building / art / dark 仅微调，忌暖米黄 / 紫粉 */
  body[data-theme="travel"]{
    --accent:#1f3a4a;--sage:#3d6a82;--bg2:#dce8f2;--stage:#e4ecf3;
  }
  body[data-theme="building"]{
    --accent:#243f58;--sage:#5a7388;--line:#d0d8e0;--bg2:#e2e8ef;--stage:#e6ebf1;--muted:#6e7c8a;
  }
  body[data-theme="art"]{
    --accent:#2a4a60;--sage:#6a8aa0;--line:#d2dce6;--bg2:#e4eef6;--stage:#e8f0f6;--muted:#6f7f8e;
  }
  body[data-theme="dark"]{
    --paper:#152a36;--ink:#e8eef4;--muted:#8a96a3;--line:#2a4050;
    --accent:#b8cfe0;--sage:#5f8a9a;--bg1:#152a36;--bg2:#0f1e28;--stage:#0c1820;
  }
/* travel 默认走 VERSO 冷雾；building / art / dark 仅微调，忌暖米黄 / 紫粉 */
  body[data-theme="travel"]{
    --accent:#1f3a4a;--sage:#3d6a82;--bg2:#dce8f2;--stage:#e4ecf3;
  }
  body[data-theme="building"]{
    --accent:#243f58;--sage:#5a7388;--line:#d0d8e0;--bg2:#e2e8ef;--stage:#e6ebf1;--muted:#6e7c8a;
  }
  body[data-theme="art"]{
    --accent:#2a4a60;--sage:#6a8aa0;--line:#d2dce6;--bg2:#e4eef6;--stage:#e8f0f6;--muted:#6f7f8e;
  }
  body[data-theme="dark"]{
    --paper:#152a36;--ink:#e8eef4;--muted:#8a96a3;--line:#2a4050;
    --accent:#b8cfe0;--sage:#5f8a9a;--bg1:#152a36;--bg2:#0f1e28;--stage:#0c1820;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh}
  body{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--stage);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;
  }

  .topbar{
    display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,var(--safe-top));
    background:color-mix(in srgb,var(--paper) 72%,#fff);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    position:relative;z-index:50;
  }
  .dots{display:flex;gap:7px}
  .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:block}
  .crumb{
    flex:1;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.65);
    border-radius:var(--radius-pill);padding:9px 18px;font-size:14px;font-weight:500;
    color:var(--ink);overflow:hidden;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  }
  .crumb .sep{color:var(--muted);opacity:.6}
  .crumb .path-item{cursor:pointer;transition:color .2s}
  .crumb .path-item:hover{color:var(--accent)}
  .crumb .dim{color:var(--muted)}
  .clear-btn{
    background:linear-gradient(160deg,#2f5168,#1a3350 55%,#122636);
    color:#fff;border:none;border-radius:var(--radius-pill);
    padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px -8px rgba(26,51,80,.45);
  }

  .stage{
    position:relative;height:calc(100dvh - var(--topbar-h) - var(--safe-top));width:100%;overflow:hidden;
    background:
      radial-gradient(ellipse 90% 55% at 12% -5%, rgba(31,58,74,.1), transparent 55%),
      radial-gradient(ellipse 70% 45% at 96% 8%, rgba(140,180,210,.22), transparent 52%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
  }

  /* 图解下方：导语 + 结构信息 */
  .detail-lead{margin:26px 0 4px;display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
  .detail-lead .lead-txt{flex:1.3;min-width:260px}
  .detail-lead .lead-txt p.lead{font-size:15.5px;line-height:1.95;opacity:.88}
  .detail-lead .meta-box{flex:1;min-width:220px}
  .meta-list{list-style:none}
  .meta-list li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .meta-list li b{color:var(--accent);font-size:14px;min-width:56px}
  .meta-list li span{color:var(--muted)}

  /* ===== 富内容区块 ===== */
  .body-blocks{margin-top:30px}
  .blk{margin-bottom:22px}
  .blk-h{font-size:18px;font-weight:600;letter-spacing:1px;margin-bottom:10px;padding-left:12px;border-left:3px solid var(--accent)}
  .blk p{font-size:15px;line-height:1.95;opacity:.88;margin-bottom:8px}
  .blk ul.pts{list-style:none;display:flex;flex-direction:column;gap:8px}
  .blk ul.pts li{position:relative;padding-left:22px;font-size:15px;line-height:1.7;opacity:.9}
  .blk ul.pts li::before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--sage)}
  table.kv{width:100%;border-collapse:collapse;font-size:14px}
  table.kv td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.kv td:first-child{color:var(--accent);font-weight:600;white-space:nowrap;width:34%}
  .tips-box{background:color-mix(in srgb,var(--accent) 8%,var(--paper));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:12px;padding:14px 18px}
  .tips-box .th{font-size:13px;letter-spacing:1px;color:var(--accent);font-weight:600;margin-bottom:8px}
  .tips-box li{list-style:none;padding-left:20px;position:relative;font-size:14px;line-height:1.7;margin-bottom:5px}
  .tips-box li::before{content:"！";position:absolute;left:0;color:var(--accent);font-weight:700}
  .budget{width:100%;border-collapse:collapse;font-size:14px}
  .budget th,.budget td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  .budget th{color:var(--muted);font-weight:600;font-size:13px;letter-spacing:1px}
  .budget td:last-child,.budget th:last-child{text-align:right}
  .budget tr.total td{border-top:2px solid var(--accent);border-bottom:none;font-weight:700;color:var(--accent)}
  .checklist{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .checklist li{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;padding:7px 10px;border:1px solid var(--line);border-radius:9px;transition:background .15s}
  .checklist li:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .checklist .box{width:17px;height:17px;border:1.5px solid var(--accent);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .checklist li.done .box{background:var(--accent)}
  .checklist li.done span{text-decoration:line-through;color:var(--muted)}

  /* ===== 真实图片图库 ===== */
  .gallery-wrap{margin-top:8px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .gallery figure{margin:0;cursor:zoom-in;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper);position:relative}
  .gallery img{width:100%;height:104px;object-fit:cover;display:block;transition:transform .3s}
  .gallery figure:hover img{transform:scale(1.06)}
  .gallery figcaption{font-size:12px;color:var(--muted);padding:6px 8px;line-height:1.4}
  .real-badge{display:inline-block;font-size:11px;letter-spacing:1px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:2px 10px;margin-left:10px;vertical-align:middle}

  /* ===== 组件通用容器 ===== */
  .widget{margin-top:8px;background:color-mix(in srgb,var(--paper) 60%,#fff);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .widget .wtitle{font-size:15px;font-weight:600;letter-spacing:1px;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}

  /* 时间轴 */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding-bottom:20px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
  .tl-year{font-size:15px;font-weight:700;color:var(--accent)}
  .tl-title{font-size:15px;font-weight:600;margin:2px 0 3px}
  .tl-desc{font-size:14px;color:var(--muted);line-height:1.7}

  /* 步骤器 */
  .stepper .steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .stepper .snum{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--muted);transition:all .2s}
  .stepper .snum.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stepper .snum.done{border-color:var(--accent);color:var(--accent)}
  .stepper .sbody{min-height:80px}
  .stepper .sbody h5{font-size:17px;margin-bottom:8px}
  .stepper .sbody p{font-size:15px;line-height:1.9;opacity:.88;margin-bottom:10px}
  .stepper .stip{font-size:13px;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:8px 12px;border-radius:8px}
  .stepper .snav{display:flex;justify-content:space-between;margin-top:16px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 20px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* 菜谱计算器 */
  .recipe .ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .stepper-num{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper-num button{width:36px;height:36px;border:none;background:color-mix(in srgb,var(--paper) 50%,#fff);font-size:18px;cursor:pointer;color:var(--accent)}
  .stepper-num .val{width:44px;text-align:center;font-size:16px;font-weight:700}
  .recipe .ing{list-style:none;display:flex;flex-direction:column;gap:2px}
  .recipe .ing li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
  .recipe .ing li .nm{display:flex;align-items:center;gap:9px}
  .recipe .ing li .qty{font-weight:700;color:var(--accent);white-space:nowrap}
  .recipe .ing li.have .nm span{text-decoration:line-through;color:var(--muted)}
  .recipe .ing li.have .qty{color:var(--muted);text-decoration:line-through}
  .recipe .hint{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}

  /* 路线规划器 */
  .route .picker{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .route .stop-pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:15px;transition:background .15s}
  .route .stop-pick:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .route .stop-pick .box{width:17px;height:17px;border:1.5px solid var(--accent);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .route .stop-pick.on .box{background:var(--accent)}
  .route .stop-pick .st-tag{margin-left:auto;font-size:12px;color:var(--muted)}
  .route .result{margin-top:6px}
  .route .r-stop{position:relative;padding:0 0 4px 30px}
  .route .r-stop::before{content:"";position:absolute;left:9px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .route .r-stop::after{content:"";position:absolute;left:14px;top:20px;bottom:-14px;width:2px;background:var(--line)}
  .route .r-stop:last-child::after{display:none}
  .route .r-name{font-size:15px;font-weight:600}
  .route .r-meta{font-size:13px;color:var(--muted);margin:2px 0 14px}
  .route .r-move{display:inline-block;font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:2px 10px;border-radius:20px;margin-top:4px}

  .back-btn{position:absolute;top:16px;left:22px;z-index:30;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--paper) 82%,#fff);border:1px solid var(--line);padding:8px 18px;border-radius:22px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}
  .hint{position:absolute;top:20px;right:28px;z-index:20;font-size:13px;color:var(--muted);letter-spacing:1px;display:flex;align-items:center;gap:6px}
  .hint .pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.2}}
  .src{position:absolute;bottom:16px;right:20px;font-size:11px;color:var(--muted);z-index:8;opacity:.7}
  .src a{color:var(--accent);text-decoration:none}

  /* 抽屉（总览组件）+ 灯箱 */
  .drawer-mask,.lightbox{position:fixed;inset:0;background:rgba(20,22,18,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:30px}
  .drawer-mask.on,.lightbox.on{display:flex}
  .drawer{background:var(--paper);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:26px 28px;position:relative}
  .drawer h3{font-size:20px;margin-bottom:4px}
  .drawer .dsub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .x-btn{position:absolute;top:16px;right:18px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;color:var(--ink)}
  .lightbox img{max-width:90%;max-height:82%;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .lightbox .lb-cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px}

  /* 窄屏 / APP：纵向堆叠，资料卡不挡地图，热点贴图 */
  @media(max-width:760px){
    :root{--topbar-h:52px}
    .topbar{gap:8px;padding:8px 10px;padding-top:max(8px,var(--safe-top))}
    .dots{display:none}
    .crumb{font-size:13px;padding:7px 12px;gap:6px}
    .crumb .dim[style*="margin-left"]{display:none!important}
    .clear-btn{padding:8px 14px;font-size:13px;flex:none}
    .stage{height:calc(100dvh - var(--topbar-h) - var(--safe-top))}

    #scene-home{
      justify-content:flex-start;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:10px 12px 18px;
      padding-bottom:max(18px,calc(12px + var(--safe-bottom)));
    }
    #scene-home .hint{position:static;margin:0 0 6px auto;max-width:none;font-size:11px}
    .scene-title{font-size:20px;letter-spacing:1px;margin-bottom:4px;padding:0 4px}
    .scene-sub{font-size:12px;max-width:100%;margin-bottom:10px;padding:0 4px;line-height:1.5}

    .canvas{
      flex:none;
      width:100%;
      max-width:100%;
      min-height:0;
      margin:0 auto 10px;
      padding:26px 10px 14px; /* 给标签上下留空，避免被裁切 */
      box-sizing:border-box;
    }
    .map-stage{max-width:100%;max-height:none;width:100%}
    .map-stage img.main{
      width:100%;
      max-width:100%;
      max-height:min(46dvh,360px);
      height:auto;
      margin:0 auto;
    }

    /* 桌面浮层资料卡 → 挪到图下方（由 JS 挂到 .facts-slot） */
    .facts-slot{display:block;margin-bottom:12px}
    .factsheet,
    .facts-slot .factsheet{
      position:static!important;
      left:auto!important;right:auto!important;top:auto!important;
      transform:none!important;
      width:100%!important;
      max-width:100%;
      padding:12px 14px;
      margin:0;
      box-shadow:none;
    }
    .factsheet h4{font-size:12px;margin-bottom:8px}
    .factsheet .row{font-size:12px;padding:5px 0}

    .home-dock{
      position:static;
      padding:0;
      margin-top:4px;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
    }
    .tools-btn{padding:10px 16px;font-size:13px}
    .footer-note{
      max-width:100%;
      white-space:normal;
      font-size:12px;
      padding:8px 12px;
      line-height:1.45;
    }

    .map-stage,.canvas{overflow:visible}
    .hotspot{width:18px;height:18px;margin-left:-9px;margin-top:-9px;border-width:1.2px}
    .hotspot::after{width:5px;height:5px}
    .hotspot .ping{inset:-4px;border-width:1px}
    .hotspot .tip{
      opacity:1;
      font-size:11px;
      padding:4px 8px;
      max-width:none;
      overflow:visible;
      text-overflow:clip;
      white-space:nowrap;
    }

    .src{position:static;opacity:.65;font-size:10px;text-align:center;margin-top:8px;padding-bottom:4px}
    .hint{top:10px;right:12px;font-size:11px;max-width:46%;text-align:right}
    .back-btn{top:12px;left:12px;padding:8px 14px;font-size:13px}
    .detail-scroll{padding:56px 14px max(40px,calc(24px + var(--safe-bottom)))}
    .diagram-head h2{font-size:22px}
    .diagram-img{max-height:42dvh}
    .detail-lead{gap:14px;margin-top:18px}
    .detail-lead .lead-txt,.detail-lead .meta-box{min-width:0;flex:1 1 100%}
    .drawer{padding:22px 18px;max-height:90dvh;border-radius:18px 18px 0 0}
    .drawer-mask,.lightbox{padding:0;align-items:flex-end}
    .lightbox{align-items:center;padding:20px}
  }

  /* APP 内嵌：由外壳提供关闭/返回，隐藏网页自带顶栏 */
  body.embed .topbar{display:none}
  body.embed{--topbar-h:0px;--safe-top:0px}
  body.embed .stage{height:100%;height:100dvh}
  body.embed .back-btn{top:max(12px,env(safe-area-inset-top,0px))}

  /* 极窄（手机 APP 常见宽度）再收紧 */
  @media(max-width:430px){
    .scene-title{font-size:18px}
    .map-stage img.main{max-height:min(42dvh,300px)}
    .hotspot{width:16px;height:16px;margin-left:-8px;margin-top:-8px}
    .hotspot::after{width:4px;height:4px}
    .hotspot .tip{font-size:10.5px;padding:3px 7px}
  }

  /* ===== 旅行攻略扩展（travel_planner.js）===== */
  body.travel-mode #travelChrome{display:block}
  #travelChrome{display:none;position:fixed;inset:0;pointer-events:none;z-index:60}
  .tv-fab{
    pointer-events:auto;position:fixed;border:none;cursor:pointer;
    display:flex;align-items:center;gap:6px;
    background:color-mix(in srgb,var(--paper) 92%,#fff);
    border:1px solid var(--line);border-radius:22px;
    padding:8px 12px;font-family:inherit;font-size:13px;color:var(--ink);
    box-shadow:0 8px 22px rgba(50,50,40,.14);
  }
  .tv-pack{top:max(12px,var(--safe-top));left:12px}
  .tv-cash{top:max(12px,var(--safe-top));right:12px;font-weight:700}
  .tv-cash-num{color:var(--accent)}
  .tv-ico{font-size:16px;line-height:1}
  .tv-plan-btn{
    pointer-events:auto;position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(18px,calc(10px + var(--safe-bottom)));
    background:var(--accent);color:#fff;border:none;border-radius:24px;
    padding:12px 22px;font-family:inherit;font-size:14px;font-weight:700;
    box-shadow:0 10px 28px rgba(47,111,143,.35);cursor:pointer;z-index:61;
  }
  body.tv-plan-open .tv-plan-btn{display:none}
  body.embed .tv-pack{top:max(52px,calc(44px + var(--safe-top)))}
  body.embed .tv-cash{top:max(52px,calc(44px + var(--safe-top)))}
  .travel-panel{width:100%;max-width:1080px;margin:18px 0 8px}
  .tv-go{margin-bottom:14px}
  .tv-go-lab{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;cursor:pointer}
  .tv-block{margin-bottom:16px;background:color-mix(in srgb,var(--paper) 70%,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tv-bh{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
  .tv-check-list{list-style:none;display:flex;flex-direction:column;gap:6px}
  .tv-check-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .tv-check-list li:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .tv-check-list li.on{background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
  .tv-box{width:18px;height:18px;border:1.5px solid var(--accent);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:16px}
  .tv-check-list li.on .tv-box{background:var(--accent)}
  .tv-thumb{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,#fff);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent)}
  .tv-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .tv-ci{flex:1;min-width:0;padding-top:2px}
  .tv-cn{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;line-height:1.35}
  .tv-bud{color:var(--accent);font-weight:700;white-space:nowrap}
  .tv-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
  .tv-sum{font-size:16px;margin:4px 0 10px}
  .tv-sum b{color:var(--accent)}
  .tv-hint{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
  .tv-lines{list-style:none}
  .tv-lines li{display:grid;grid-template-columns:1.1fr 1.2fr auto;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .tv-l-k{color:var(--muted)}
  .tv-l-a{font-weight:700;color:var(--accent);white-space:nowrap}
  .tv-pack-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .tv-pack-list li{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .tv-check{color:var(--accent);font-weight:700}

  /* ===== 插画行李箱行李清单 ===== */
  .drawer.tv-drawer-bag{max-width:640px}
  .tv-bag{text-align:center;margin-bottom:14px}
  .tv-bag-case{
    position:relative;display:inline-block;max-width:min(100%,340px);
    transition:transform .55s cubic-bezier(.4,.1,.3,1),filter .55s ease;
    transform-origin:50% 80%;
  }
  .tv-bag-img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
  .tv-bag-pile{
    position:absolute;left:12%;right:12%;top:28%;bottom:18%;
    display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;
    gap:2px;pointer-events:none;overflow:hidden;
  }
  .tv-bag-chip{
    width:22%;aspect-ratio:1;border-radius:8px;overflow:hidden;
    border:1px solid color-mix(in srgb,var(--paper) 70%,#fff);
    box-shadow:0 2px 6px rgba(50,50,40,.12);
    animation:tvBagBob calc(1.1s + var(--i) * .12s) ease-in-out infinite;
    animation-delay:calc(var(--i) * .05s);
  }
  .tv-bag-chip img{display:block;width:100%;height:100%;object-fit:cover}
  .tv-bag-weight{
    margin-top:8px;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent);
  }
  .tv-bag.w0 .tv-bag-case{transform:scale(1);filter:none}
  .tv-bag.w0 .tv-bag-chip{animation-duration:1s}
  .tv-bag.w1 .tv-bag-case{transform:scale(1.01) translateY(1px)}
  .tv-bag.w1 .tv-bag-chip{animation-duration:1.35s}
  .tv-bag.w2 .tv-bag-case{transform:scale(1.02) translateY(3px) scaleY(.98);filter:saturate(.95)}
  .tv-bag.w2 .tv-bag-chip{animation-duration:1.8s}
  .tv-bag.w3 .tv-bag-case{
    transform:scale(1.03) translateY(6px) scaleY(.94) rotate(-.6deg);
    filter:saturate(.88) brightness(.97);
  }
  .tv-bag.w3 .tv-bag-chip{animation-duration:2.6s}
  .tv-bag.w3 .tv-bag-weight{color:color-mix(in srgb,var(--ink) 55%,var(--accent))}
  .tv-bag-case.swallow{animation:tvBagSwallow .45s ease}
  .tv-bag-case.spit{animation:tvBagSpit .45s ease}
  @keyframes tvBagBob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
  }
  @keyframes tvBagSwallow{
    0%{transform:scale(1)}
    40%{transform:scale(1.04) scaleY(.96)}
    100%{transform:scale(1)}
  }
  @keyframes tvBagSpit{
    0%{transform:scale(1)}
    35%{transform:scale(.97) translateY(-4px)}
    100%{transform:scale(1)}
  }
  .tv-pack-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;
  }
  .tv-pack-item{
    appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 8px 8px;border-radius:14px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--paper) 85%,#fff);color:var(--ink);
    transition:border-color .2s,background .2s,transform .2s,opacity .2s;
  }
  .tv-pack-item:hover{transform:translateY(-1px)}
  .tv-pack-item.on{
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
    background:color-mix(in srgb,var(--accent) 8%,var(--paper));
  }
  .tv-pack-item:not(.on){opacity:.72}
  .tv-pack-item:not(.on) .tv-pack-ico{filter:grayscale(.35) opacity(.85)}
  .tv-pack-ico{
    width:56px;height:56px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:var(--stage);
  }
  .tv-pack-ico img{display:block;width:100%;height:100%;object-fit:cover}
  .tv-pack-name{font-size:11.5px;line-height:1.3;text-align:center;max-width:100%}
  .tv-pack-tick{
    font-size:12px;font-weight:700;color:var(--accent);min-height:1em;
  }
  .tv-pack-ghost{
    position:fixed;z-index:400;width:52px;height:52px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);pointer-events:none;
    transition:left .55s cubic-bezier(.4,.05,.2,1),top .55s cubic-bezier(.4,.05,.2,1),
      transform .55s cubic-bezier(.4,.05,.2,1),opacity .55s ease;
    box-shadow:0 8px 20px rgba(50,50,40,.2);
  }
  .tv-pack-ghost img{display:block;width:100%;height:100%;object-fit:cover}
  .tv-map-wrap{margin:8px 0 22px}
  .tv-map-wrap.baked .tv-route,
  .tv-map-wrap.baked .tv-map-pins{display:none}
  .tv-map-stage{position:relative;width:100%;max-width:720px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
  .tv-map-img{display:block;width:100%;height:auto}
  .tv-route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .tv-route-soft{stroke:color-mix(in srgb,var(--accent) 22%,transparent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .tv-route-line{stroke:var(--accent);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.88;fill:none}
  .tv-map-pins{position:absolute;inset:0;pointer-events:none}
  .tv-map-pin{position:absolute;transform:translate(-50%,-50%);z-index:2}
  .tv-map-num{
    display:flex;width:18px;height:18px;border-radius:50%;
    background:color-mix(in srgb,var(--paper) 88%,#fff);color:var(--accent);
    font-size:10px;font-weight:700;align-items:center;justify-content:center;
    border:1.5px solid var(--accent);box-shadow:0 1px 4px rgba(50,50,40,.12);
  }
  .tv-map-legend{
    display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;
    max-width:720px;margin:10px auto 0;padding:0 4px;
  }
  .tv-leg-item{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--ink);
  }
  .tv-leg-item i{
    display:inline-flex;width:16px;height:16px;border-radius:50%;
    border:1.2px solid var(--accent);color:var(--accent);
    font-size:10px;font-style:normal;font-weight:700;
    align-items:center;justify-content:center;
  }

  /* ===== 图示攻略（杂志风分日版式，非卡通手绘）===== */
  .tv-guide{width:100%;max-width:720px;margin:0 auto}
  .tv-cover{
    text-align:center;padding:8px 8px 20px;margin-bottom:8px;
    border-bottom:1px dashed var(--line);
  }
  .tv-cover-tag{
    display:inline-block;font-size:11px;letter-spacing:2px;color:#fff;
    background:var(--sage);padding:3px 12px;border-radius:20px;margin-bottom:12px;
  }
  .tv-cover h2{font-size:clamp(22px,5vw,30px);letter-spacing:2px;font-weight:600;margin-bottom:6px}
  .tv-cover-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px}
  .tv-cover-stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    max-width:420px;margin:0 auto 16px;
  }
  .tv-stat{
    background:color-mix(in srgb,var(--paper) 75%,#fff);
    border:1px solid var(--line);border-radius:12px;padding:10px 6px;
  }
  .tv-stat b{display:block;font-size:18px;font-weight:700;color:var(--ink);line-height:1.2}
  .tv-stat.accent b{color:var(--accent);font-size:15px}
  .tv-stat span{font-size:11px;color:var(--muted);letter-spacing:1px}
  .tv-day-nav{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    position:sticky;top:0;z-index:5;
    padding:10px 4px 12px;margin:4px 0 8px;
    background:color-mix(in srgb,var(--stage) 88%,transparent);
    backdrop-filter:blur(8px);
  }
  .tv-nav-day{
    appearance:none;-webkit-appearance:none;cursor:pointer;
    text-decoration:none;color:var(--accent);font-size:12px;font-weight:700;
    border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
    background:color-mix(in srgb,var(--accent) 8%,var(--paper));
    padding:6px 12px;border-radius:16px;letter-spacing:1px;font-family:inherit;
  }
  .tv-nav-day.on{
    background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .tv-days{display:block;margin:8px 0 8px;min-height:200px}
  .tv-day-pane{display:none}
  .tv-day-pane.on{display:block;animation:tvDayIn .35s ease}
  @keyframes tvDayIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tv-sec-h{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin:4px 0 12px;padding:0 2px;
  }
  .tv-sec-h span{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--ink)}
  .tv-sec-h em{font-style:normal;font-size:12px;color:var(--muted)}

  .tv-day-page{
    background:
      linear-gradient(180deg,color-mix(in srgb,var(--paper) 92%,#fff),color-mix(in srgb,var(--bg2) 40%,var(--paper)));
    border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 28px rgba(50,50,40,.08);
  }
  .tv-day-ribbon{
    text-align:center;padding:18px 16px 14px;
    background:
      radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),
      color-mix(in srgb,var(--paper) 88%,#fff);
    border-bottom:1px dashed var(--line);
  }
  .tv-day-num{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:3px;
    color:var(--accent);margin-bottom:6px;
  }
  .tv-day-theme{font-size:22px;letter-spacing:2px;font-weight:600;margin:0}
  .tv-day-tip{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:36em;margin-left:auto;margin-right:auto}
  .tv-itin{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 4px;
    margin-top:14px;padding:10px 12px;border-radius:12px;
    background:color-mix(in srgb,var(--paper) 70%,#fff);border:1px dashed var(--line);
    font-size:12px;line-height:1.4;
  }
  .tv-itin-k{font-weight:700;color:var(--accent);letter-spacing:1px;margin-right:4px}
  .tv-itin em{font-style:normal;font-weight:600;color:var(--ink);max-width:9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-itin-sep{color:var(--accent);opacity:.7;padding:0 2px}

  .tv-slots{display:flex;flex-direction:column;gap:0;padding:4px 0}
  .tv-slot{
    display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:stretch;
    padding:16px 14px;border-bottom:1px dashed color-mix(in srgb,var(--line) 80%,transparent);
  }
  .tv-slot:last-child{border-bottom:none}
  .tv-slot.reverse{grid-template-columns:1.2fr 1fr}
  .tv-slot.reverse .tv-slot-copy{order:2}
  .tv-slot.reverse .tv-slot-media{order:1}
  .tv-slot-meta{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
  .tv-slot-num{
    display:inline-flex;width:20px;height:20px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:11px;font-weight:700;
    align-items:center;justify-content:center;
  }
  .tv-slot-pill{
    display:inline-flex;align-items:center;
    font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;
    background:var(--accent);padding:3px 10px;border-radius:12px;
  }
  .tv-slot.kind-food .tv-slot-pill{background:var(--sage)}
  .tv-slot.kind-stay .tv-slot-pill{background:color-mix(in srgb,var(--ink) 72%,var(--accent))}
  .tv-slot-kind{
    font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
    padding:2px 7px;border-radius:8px;
  }
  .tv-slot-time{font-size:11px;color:var(--muted);letter-spacing:.5px}
  .tv-slot-title{font-size:16px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;line-height:1.35}
  .tv-slot-body{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:8px}
  .tv-slot-bullets{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:4px}
  .tv-slot-bullets li{
    position:relative;padding-left:12px;font-size:12px;color:var(--ink);line-height:1.45;
  }
  .tv-slot-bullets li::before{
    content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;
    background:var(--accent);
  }
  .tv-slot.kind-food .tv-slot-bullets li::before{background:var(--sage)}
  .tv-tip-box{
    font-size:12px;line-height:1.5;color:var(--ink);margin-bottom:8px;
    padding:8px 10px;border-radius:10px;
    background:color-mix(in srgb,var(--accent) 8%,var(--paper));
    border:1px dashed color-mix(in srgb,var(--accent) 30%,var(--line));
  }
  .tv-tip-box span{display:inline-block;font-weight:700;color:var(--accent);margin-right:6px;letter-spacing:1px;font-size:11px}
  .tv-chips{display:flex;flex-wrap:wrap;gap:6px}
  .tv-chip{
    font-size:11px;color:var(--ink);
    background:color-mix(in srgb,var(--accent) 8%,var(--paper));
    border:1px solid var(--line);border-radius:10px;padding:3px 8px;
  }
  .tv-chip.muted{color:var(--muted)}
  .tv-slot-media{display:flex;flex-direction:column;gap:6px;min-width:0}
  .tv-slot-visual{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--stage)}
  .tv-slot-visual img,.tv-slot-side img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.92) contrast(1.02)}
  .tv-slot-side-wrap{display:flex;flex-direction:column;gap:4px}
  .tv-slot-side{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:var(--stage)}
  .tv-slot-ph{width:100%;height:100%;background:
    radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 55%),
    var(--stage)}
  /* 标注放在图下方，不遮挡画面 */
  .tv-slot-cap{
    display:block;font-size:11px;line-height:1.35;color:var(--muted);
    padding:2px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tv-slot.kind-food .tv-slot-cap{color:var(--sage)}
  .tv-slot.kind-stay .tv-slot-cap{color:color-mix(in srgb,var(--ink) 70%,var(--accent))}
  .tv-slot.kind-play .tv-slot-cap{color:var(--accent)}

  .tv-day-foot{
    padding:14px 14px 16px;
    background:color-mix(in srgb,var(--paper) 70%,#fff);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start;
  }
  .tv-day-foot-h{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:10px;text-align:center}
  .tv-day-tips{
    border:1px dashed var(--line);border-radius:12px;padding:10px 12px;
    background:color-mix(in srgb,var(--paper) 90%,#fff);
  }
  .tv-day-tips-h{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:6px}
  .tv-day-tips p,.tv-day-tips li{font-size:12px;color:var(--ink);line-height:1.5}
  .tv-day-tips ul{list-style:none;display:flex;flex-direction:column;gap:4px}
  .tv-flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 4px}
  .tv-flow-node{
    display:inline-flex;align-items:center;gap:5px;
    background:color-mix(in srgb,var(--paper) 90%,#fff);
    border:1px solid var(--line);border-radius:12px;padding:5px 9px 5px 5px;
  }
  .tv-flow-node i{
    display:inline-flex;width:16px;height:16px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:10px;font-style:normal;font-weight:700;
    align-items:center;justify-content:center;
  }
  .tv-flow-node em{font-style:normal;font-size:11.5px;max-width:7.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-flow-arrow{
    width:18px;height:1px;background:var(--accent);opacity:.45;position:relative;flex:none;
  }
  .tv-flow-arrow::after{
    content:"";position:absolute;right:-1px;top:-3px;
    border:4px solid transparent;border-left-color:var(--accent);opacity:.7;
  }

  .tv-guide-end{margin:8px 0 24px}
  .tv-end-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tv-end-card{
    background:color-mix(in srgb,var(--paper) 75%,#fff);
    border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .tv-pack-peek{display:flex;flex-wrap:wrap;gap:6px}
  .tv-guide-sign{
    text-align:center;margin-top:18px;font-size:13px;color:var(--muted);
    letter-spacing:1px;font-style:italic;
  }

  @media(max-width:760px){
    .tv-lines li{grid-template-columns:1fr;gap:2px}
    .tv-plan-btn{font-size:13px;padding:11px 18px}
    .tv-cover-stats{grid-template-columns:repeat(2,1fr);max-width:280px}
    .tv-slot,.tv-slot.reverse{grid-template-columns:1fr;gap:10px}
    .tv-slot.reverse .tv-slot-copy,.tv-slot.reverse .tv-slot-media{order:unset}
    .tv-slot-visual{aspect-ratio:16/10}
    .tv-end-grid{grid-template-columns:1fr}
    .tv-day-theme{font-size:18px}
    .tv-day-foot{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="crumb">
    <span class="path-item" onclick="goHome()" id="crumbHome"></span>
    <span class="sep" id="crumbSep" style="display:none">/</span>
    <span class="path-item dim" id="crumbDetail" style="display:none"></span>
    <span class="dim" style="margin-left:auto">Continue this session</span>
  </div>
  <button class="clear-btn" onclick="goHome()">Clear</button>
</div>

(function(){
  const D = window.FLIPBOOK;
  if(!D){document.body.innerHTML='<p style="padding:40px">缺少数据：window.FLIPBOOK 未注入</p>';return;}
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const params=new URLSearchParams(location.search);
  const embedded=params.has('embed')||(window.self!==window.top);

  document.body.dataset.theme = (D.meta.theme)||'travel';
  document.title = D.meta.title + ' · 交互图鉴';

  document.getElementById('crumbHome').textContent = D.meta.title + (D.meta.enTitle? ' · '+D.meta.enTitle : '');
  document.getElementById('homeTitle').textContent = D.meta.title;
  document.getElementById('homeSub').textContent = D.meta.subtitle||'';
  document.getElementById('homeNote').textContent = D.meta.footer||'';
  document.getElementById('hintText').textContent = D.meta.hint||'点击光点查看细节';
  document.getElementById('mainImg').src = D.overview.image;

  const mapStage=document.getElementById('mapStage');

  const narrowMq=window.matchMedia('(max-width:760px)');

  // 数据档案卡：宽屏浮在地图旁，窄屏落到图下方，避免遮挡
  let factsheetEl=null;
  if(D.overview.facts && D.overview.facts.length){
    factsheetEl=document.createElement('div');
    factsheetEl.className='factsheet '+(D.overview.factsSide||'right');
    let html='<h4>'+esc(D.overview.factsTitle||'DATA · 数据档案')+'</h4>';
    D.overview.facts.forEach(f=>{html+='<div class="row"><span class="k">'+esc(f.k)+'</span><span class="v">'+esc(f.v)+'</span></div>';});
    factsheetEl.innerHTML=html;
  }
  function placeFactsheet(){
    if(!factsheetEl) return;
    if(narrowMq.matches){
      factsSlot.appendChild(factsheetEl);
    }else{
      homeCanvas.appendChild(factsheetEl);
    }
  }
  placeFactsheet();
  if(narrowMq.addEventListener) narrowMq.addEventListener('change', placeFactsheet);
  else if(narrowMq.addListener) narrowMq.addListener(placeFactsheet);

  // 热点：挂在 map-stage 上，百分比相对插画本身
  D.cards.forEach((c,i)=>{
    const h=document.createElement('div');
    const x=c.x==null?50:c.x, y=c.y==null?50:c.y;
    let cls='hotspot';
    if(x<30) cls+=' tip-right';
    else if(x>70) cls+=' tip-left';
    if(y<24) cls+=' tip-below';
    h.className=cls;
    h.style.left=x+'%';h.style.top=y+'%';
    h.innerHTML='<span class="ping" aria-hidden="true"></span><span class="tip">'+esc(c.label)+'</span>';
    h.onclick=()=>openDetail(i);
    mapStage.appendChild(h);
  });

  // 总览级组件（时间轴等）→ 工具按钮；route 由旅行「生成我的攻略」承接，不再显示「规划我的路线」
  const OV = D.overview.widget;
  if(OV && OV.type !== 'route'){
    const tb=document.getElementById('toolsBtn');
    tb.style.display='flex';
    document.getElementById('toolsLabel').textContent = OV.button || (OV.type==='timeline'?'查看时间轴':'互动工具');
  }

  const sHome=document.getElementById('scene-home'),sDetail=document.getElementById('scene-detail');
  const crumbSep=document.getElementById('crumbSep'),crumbDetail=document.getElementById('crumbDetail'),crumbHome=document.getElementById('crumbHome');

  /* ---------- 富内容区块渲染 ---------- */
  function renderBody(host,blocks){
    host.innerHTML='';
    (blocks||[]).forEach(b=>{
      const d=document.createElement('div');d.className='blk';
      if(b.h){d.innerHTML+='<div class="blk-h">'+esc(b.h)+'</div>';}
      if(b.type==='para'||(!b.type&&b.text)){
        (Array.isArray(b.text)?b.text:[b.text]).forEach(t=>d.innerHTML+='<p>'+esc(t)+'</p>');
      }else if(b.type==='list'){
        let ul='<ul class="pts">';(b.items||[]).forEach(t=>ul+='<li>'+esc(t)+'</li>');ul+='</ul>';d.innerHTML+=ul;
      }else if(b.type==='table'){
        let tb='<table class="kv">';(b.rows||[]).forEach(r=>tb+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>');tb+='</table>';d.innerHTML+=tb;
      }else if(b.type==='tips'){
        let t='<div class="tips-box"><div class="th">'+esc(b.h||'注意事项')+'</div><ul>';(b.items||[]).forEach(x=>t+='<li>'+esc(x)+'</li>');t+='</ul></div>';
        d.innerHTML=t;
      }else if(b.type==='budget'){
        let t='<table class="budget"><tr><th>'+esc((b.cols&&b.cols[0])||'项目')+'</th><th>'+esc((b.cols&&b.cols[1])||'金额')+'</th></tr>';
        let sum=0,hasNum=true;
        (b.rows||[]).forEach(r=>{t+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';const n=parseFloat(String(r[1]).replace(/[^\d.]/g,''));if(isNaN(n))hasNum=false;else sum+=n;});
        if(b.total){t+='<tr class="total"><td>'+esc(b.total[0])+'</td><td>'+esc(b.total[1])+'</td></tr>';}
        else if(hasNum&&(b.rows||[]).length){t+='<tr class="total"><td>合计</td><td>≈ '+sum+'</td></tr>';}
        t+='</table>';d.innerHTML+=t;
      }else if(b.type==='checklist'){
        let ul='<ul class="checklist">';(b.items||[]).forEach(x=>ul+='<li onclick="this.classList.toggle(\'done\')"><span class="box">✓</span><span>'+esc(x)+'</span></li>');ul+='</ul>';d.innerHTML+=ul;
      }
      host.appendChild(d);
    });
  }

  /* ---------- 真实图片图库 ---------- */
  function renderGallery(host,photos){
    host.innerHTML='';
    if(!photos||!photos.length)return;
    const wrap=document.createElement('div');
    wrap.innerHTML='<div class="blk-h">视频实拍参考 <span class="real-badge">REAL · 来自原视频</span></div>';
    const g=document.createElement('div');g.className='gallery';
    photos.forEach(p=>{
      const fig=document.createElement('figure');
      fig.innerHTML='<img src="'+esc(p.url)+'" alt=""><figcaption>'+esc(p.cap||'')+'</figcaption>';
      fig.onclick=()=>openLightbox(p.url,p.cap||'');
      g.appendChild(fig);
    });
    wrap.appendChild(g);host.appendChild(wrap);
  }

  /* ---------- 组件引擎 ---------- */
  function renderWidget(host,w){
    host.innerHTML='';
    if(!w)return;
    const box=document.createElement('div');box.className='widget';
    box.innerHTML='<div class="wtitle">'+esc(w.title||'互动组件')+'</div>';
    const body=document.createElement('div');box.appendChild(body);host.appendChild(box);
    ({timeline:wTimeline,stepper:wStepper,recipe:wRecipe,route:wRoute}[w.type]||(()=>{}))(body,w);
  }

  function wTimeline(host,w){
    const tl=document.createElement('div');tl.className='timeline';
    (w.events||[]).forEach(e=>{
      const it=document.createElement('div');it.className='tl-item';
      it.innerHTML='<div class="tl-year">'+esc(e.year||'')+'</div><div class="tl-title">'+esc(e.title||'')+'</div><div class="tl-desc">'+esc(e.desc||'')+'</div>';
      tl.appendChild(it);
    });
    host.appendChild(tl);
  }

  function wStepper(host,w){
    const steps=w.steps||[];let cur=0;
    const nav=document.createElement('div');nav.className='steps';
    const body=document.createElement('div');body.className='sbody';
    const foot=document.createElement('div');foot.className='snav';
    const prev=document.createElement('button');prev.className='btn ghost';prev.textContent='← 上一步';
    const next=document.createElement('button');next.className='btn';next.textContent='下一步 →';
    foot.appendChild(prev);foot.appendChild(next);
    steps.forEach((s,i)=>{const n=document.createElement('div');n.className='snum';n.textContent=(i+1);n.onclick=()=>{cur=i;draw();};nav.appendChild(n);});
    function draw(){
      [...nav.children].forEach((n,i)=>{n.className='snum'+(i===cur?' active':i<cur?' done':'');});
      const s=steps[cur]||{};
      body.innerHTML='<h5>'+esc(s.title||('步骤 '+(cur+1)))+'</h5>'+(s.detail?'<p>'+esc(s.detail)+'</p>':'')+(s.tip?'<div class="stip">TIP · '+esc(s.tip)+'</div>':'');
      prev.disabled=cur===0;next.disabled=cur===steps.length-1;
    }
    prev.onclick=()=>{if(cur>0){cur--;draw();}};next.onclick=()=>{if(cur<steps.length-1){cur++;draw();}};
    host.appendChild(nav);host.appendChild(body);host.appendChild(foot);draw();
  }

  function wRecipe(host,w){
    const base=w.baseServings||1;let n=base;
    const have=new Set();
    const ctrl=document.createElement('div');ctrl.className='ctrl';
    ctrl.innerHTML='<span>用餐人数</span>';
    const num=document.createElement('div');num.className='stepper-num';
    num.innerHTML='<button>−</button><span class="val">'+n+'</span><button>＋</button>';
    ctrl.appendChild(num);
    const persp=document.createElement('span');persp.style.color='var(--muted)';persp.style.fontSize='13px';persp.textContent='（基准 '+base+' 人份，勾选“我已有”自动从清单剔除）';
    ctrl.appendChild(persp);
    const ul=document.createElement('ul');ul.className='ing';
    const hint=document.createElement('div');hint.className='hint';hint.textContent=w.hint||'';
    function fmt(q){const v=q*n/base;return (Math.round(v*100)/100);}
    function draw(){
      num.querySelector('.val').textContent=n;
      ul.innerHTML='';
      (w.ingredients||[]).forEach((ig,i)=>{
        const li=document.createElement('li');if(have.has(i))li.className='have';
        li.innerHTML='<span class="nm"><span class="box" style="width:16px;height:16px;border:1.5px solid var(--accent);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;'+(have.has(i)?'background:var(--accent)':'')+'">'+(have.has(i)?'✓':'')+'</span><span>'+esc(ig.name)+'</span></span><span class="qty">'+fmt(ig.qty)+' '+esc(ig.unit||'')+'</span>';
        li.onclick=()=>{have.has(i)?have.delete(i):have.add(i);draw();};
        ul.appendChild(li);
      });
    }
    num.children[0].onclick=()=>{if(n>1){n--;draw();}};
    num.children[2].onclick=()=>{if(n<20){n++;draw();}};
    host.appendChild(ctrl);host.appendChild(ul);if(w.hint)host.appendChild(hint);draw();
  }

  function wRoute(host,w){
    const stops=w.stops||[];const sel=new Set(stops.map((_,i)=>i));
    const picker=document.createElement('div');picker.className='picker';
    stops.forEach((s,i)=>{
      const row=document.createElement('div');row.className='stop-pick on';
      row.innerHTML='<span class="box">✓</span><span>'+esc(s.name)+'</span><span class="st-tag">'+esc(s.tag||'')+'</span>';
      row.onclick=()=>{if(sel.has(i)){sel.delete(i);row.classList.remove('on');row.querySelector('.box').textContent='';}else{sel.add(i);row.classList.add('on');row.querySelector('.box').textContent='✓';}};
      picker.appendChild(row);
    });
    const gen=document.createElement('button');gen.className='btn';gen.textContent='生成我的路线图 →';gen.style.marginBottom='4px';
    const result=document.createElement('div');result.className='result';
    gen.onclick=()=>{
      const chosen=stops.filter((_,i)=>sel.has(i));
      if(!chosen.length){result.innerHTML='<div class="r-meta">请至少选择一个目的地。</div>';return;}
      let h='<div class="blk-h" style="margin-bottom:14px">你的专属动线（共 '+chosen.length+' 站）</div>';
      chosen.forEach((s,i)=>{
        h+='<div class="r-stop"><div class="r-name">'+(i+1)+'. '+esc(s.name)+'</div>';
        if(s.stay)h+='<div class="r-meta">建议停留：'+esc(s.stay)+(s.tip?' · '+esc(s.tip):'')+'</div>';
        if(i<chosen.length-1&&s.moveNext)h+='<span class="r-move">↓ '+esc(s.moveNext)+'</span>';
        h+='</div>';
      });
      result.innerHTML=h;
    };
    host.appendChild(picker);host.appendChild(gen);host.appendChild(result);
    gen.onclick();
  }

  /* ---------- 灯箱 ---------- */
  window.openLightbox=function(url,cap){document.getElementById('lbImg').src=url;document.getElementById('lbCap').textContent=cap||'';document.getElementById('lightbox').classList.add('on');};
  window.closeLightbox=function(){document.getElementById('lightbox').classList.remove('on');};

  /* ---------- 总览抽屉 ---------- */
  window.openTools=function(){
    const w=D.overview.widget;if(!w)return;

  };
  window.closeTools=function(){document.getElementById('drawerMask').classList.remove('on');};
  function renderWidget_into(host,w){host.innerHTML='';const body=document.createElement('div');host.appendChild(body);({timeline:wTimeline,stepper:wStepper,recipe:wRecipe,route:wRoute}[w.type]||(()=>{}))(body,w);}

  /* ---------- 图解内容 ---------- */
  // 宽屏：两侧引线气泡；窄屏：左图右文，不再往图上叠标注
  const annoNarrowMq=window.matchMedia('(max-width:860px)');
  function renderAnnotations(card){
    const diagram=document.getElementById('diagram');
    const svg=document.getElementById('leaders');
    const split=document.getElementById('detailSplit');
    const rail=document.getElementById('detailRail');
    diagram.querySelectorAll('.anno,.dot,.pin,.pin-label').forEach(n=>n.remove());
    svg.innerHTML='';
    rail.innerHTML='';
    rail.hidden=true;
    split.classList.remove('split-on');
    const list=card.annotations||[];

    if(annoNarrowMq.matches){
      // 手机：干净插画 + 右侧介绍栏
      split.classList.add('split-on');
      rail.hidden=false;
      let body='';
      if(list.length){
        body=list.map(a=>
          '<div class="dr-item"><div class="dr-t">'+esc(a.t||'')+'</div>'+
          (a.d?'<div class="dr-d">'+esc(a.d)+'</div>':'')+'</div>'
        ).join('');
      }else if(card.meta&&card.meta.length){
        body=card.meta.map(m=>
          '<div class="dr-item"><div class="dr-t">'+esc(m[0])+'</div>'+
          '<div class="dr-d">'+esc(m[1])+'</div></div>'
        ).join('');
      }else if(card.desc){
        body='<div class="dr-item"><div class="dr-d">'+esc(card.desc)+'</div></div>';
      }
      rail.innerHTML='<div class="dr-head">相关介绍</div>'+body;
      return;
    }

    if(!list.length) return;
    // 桌面：经典双侧引线气泡
    list.forEach((a,idx)=>{
      const ax=a.ax==null?50:a.ax, ay=a.ay==null?50:a.ay;
      const side=(a.side==='left'||a.side==='right')?a.side:(ax<50?'left':'right');

      diagram.appendChild(wrap);
      const dot=document.createElement('div');dot.className='dot';
      dot.style.left=ax+'%';dot.style.top=ay+'%';
      dot.style.transitionDelay=(0.12+idx*0.1)+'s';
      diagram.appendChild(dot);
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',ax+'%');line.setAttribute('y1',ay+'%');
      line.setAttribute('x2',(side==='left'?0:100)+'%');line.setAttribute('y2',ay+'%');
      line.style.transitionDelay=(0.12+idx*0.1)+'s';
      svg.appendChild(line);
    });
  }

  window.openDetail=function(i){
    const c=D.cards[i];if(!c)return;
    document.getElementById('detailTag').textContent=c.tag||'';

    renderBody(document.getElementById('detailBody'),c.body);
    renderGallery(document.getElementById('detailGallery'),c.realPhotos);
    renderWidget(document.getElementById('detailWidget'),c.widget);
    document.querySelector('.detail-scroll').scrollTop=0;
    // 图解标注
    const diagram=document.getElementById('diagram');
    diagram.classList.remove('entered');
    const hasAnno=!!(c.annotations&&c.annotations.length);
    document.getElementById('diagramHint').style.display=(hasAnno && !annoNarrowMq.matches)?'block':'none';

    const ms=document.getElementById('mapStage');
    const hx=(c.x==null?50:c.x), hy=(c.y==null?50:c.y);
    ms.style.transformOrigin=hx+'% '+hy+'%';
    ms.classList.add('pushing');
    sHome.classList.remove('active');sHome.classList.add('zoomed-out');
    setTimeout(()=>{
      sDetail.classList.add('active');
      requestAnimationFrame(()=>requestAnimationFrame(()=>diagram.classList.add('entered')));
    },430);
    crumbSep.style.display='inline';crumbDetail.style.display='inline';
    crumbHome.classList.add('dim');crumbDetail.classList.remove('dim');
  };
  window.goHome=function(){
    const diagram=document.getElementById('diagram');if(diagram)diagram.classList.remove('entered');
    sDetail.classList.remove('active');
    const sPlan=document.getElementById('scene-plan');if(sPlan) sPlan.classList.remove('active');
    sHome.classList.remove('zoomed-out');sHome.classList.add('active');
    const ms=document.getElementById('mapStage');if(ms) ms.classList.remove('pushing');
    crumbSep.style.display='none';crumbDetail.style.display='none';crumbHome.classList.remove('dim');
  };
})();
</script>
<script>
/* Travel planner — loaded when theme=travel or cards carry food/stay/packing */
(function () {
  const D = window.FLIPBOOK;
  if (!D || !D.cards) return;
  const isTravel =
    (D.meta && D.meta.theme === "travel") ||
    D.cards.some((c) => c.food || c.stay || c.play || c.packing);
  if (!isTravel) return;

  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"]/g, (m) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])
    );
  const yen = (n) => "¥" + Math.round(n).toLocaleString("zh-CN");

  // ---- state ----
  const go = {}; // cardIdx -> bool
  const pick = {}; // cardIdx -> { food:{}, stay:{}, play:{}, pack:{} }
  const visited = new Set();

  D.cards.forEach((c, i) => {
    go[i] = c.goDefault !== false;
    pick[i] = { food: {}, stay: {}, play: {}, pack: {} };
    (c.food || []).forEach((it, j) => {
      pick[i].food[j] = !!it.defaultOn;
    });
    (c.stay || []).forEach((it, j) => {
      pick[i].stay[j] = it.defaultOn !== false;
    });
    (c.play || []).forEach((it, j) => {
      pick[i].play[j] = !!it.defaultOn;
    });
    (c.packing || []).forEach((_, j) => {
      pick[i].pack[j] = true;
    });
  });

  function itemBudget(it) {
    const b = Number(it.budget) || 0;
    const nights = Number(it.nights) || 1;
    return it.nights != null ? b * nights : b;
  }

  function calcTotal() {
    let total = 0;
    const lines = [];
    D.cards.forEach((c, i) => {
      if (!go[i]) return;
      const groups = [
        ["美食", c.food, pick[i].food],
        ["住宿", c.stay, pick[i].stay],
        ["游玩", c.play, pick[i].play],
      ];
      groups.forEach(([label, arr, map]) => {
        (arr || []).forEach((it, j) => {
          if (!map[j]) return;
          const amt = itemBudget(it);
          total += amt;
          lines.push({
            place: c.name || c.label,
            kind: label,
            name: it.name,
            amt,
            note: it.note || "",
          });
        });
      });
    });
    return { total, lines };
  }

  function selectedStops() {
    return D.cards
      .map((c, i) => ({ c, i }))
      .filter(({ i }) => go[i]);
  }

  function orderStops(stops) {
    if (stops.length <= 1) return stops.slice();

    // 1) Explicit routeOrder on cards
    if (stops.every(({ c }) => c.routeOrder != null)) {
      return stops.slice().sort(
        (a, b) => Number(a.c.routeOrder) - Number(b.c.routeOrder)
      );
    }

    // 2) Match overview.widget.route stops by STOP tag / short label (not fuzzy full name)
    const routeStops = (D.overview.widget && D.overview.widget.stops) || [];
    if (routeStops.length) {
      const scored = stops.map((s) => {
        const tag = (s.c.tag || "").toUpperCase();
        const label = s.c.label || "";
        let idx = routeStops.findIndex((r, ri) => {
          const rt = (r.tag || "").toUpperCase();
          if (rt && tag && (tag.includes(rt) || rt.includes(tag.replace(/[^A-Z0-9]/g, ""))))
            return true;
          // "泗水 · 火山站" vs "泗水 · 火山站"
          if (r.name && (label === r.name || label.includes(r.name.split("·")[0].trim())))
            return true;
          return false;
        });
        if (idx < 0) idx = 1000 + s.i;
        return { s, idx };
      });
      scored.sort((a, b) => a.idx - b.idx);
      return scored.map((x) => x.s);
    }

    // 3) Keep authoring order (cards[] sequence) — usually narrative route
    return stops.slice().sort((a, b) => a.i - b.i);
  }

  function estimateDays(ordered) {
    let days = 0;
    ordered.forEach(({ c, i }) => {
      let d = Number(c.daysSuggest) || 0;
      if (!d) {
        const stays = c.stay || [];
        let nights = 0;
        stays.forEach((it, j) => {
          if (pick[i].stay[j]) nights += Number(it.nights) || 1;
        });
        d = nights > 0 ? nights : 1;
      }
      days += d;
    });
    days = Math.max(1, Math.ceil(days));
    const nights = Math.max(0, days - 1);
    return { days, nights, label: days + "天" + nights + "晚" };
  }

  function selectedItems(arr, map) {
    return (arr || [])
      .map((x, j) => ({ x, j }))
      .filter(({ j }) => map[j])
      .map(({ x }) => x);
  }

  function isComicUrl(u) {
    if (!u) return false;
    // 视频帧多为 jpg；攻略统一只用漫画/插画（png 或本地 media）
    if (/\.jpe?g(\?|#|$)/i.test(u)) return false;
    return true;
  }

  function photoPool(c) {
    const urls = [];
    const push = (u) => {
      if (isComicUrl(u) && !urls.includes(u)) urls.push(u);
    };
    // 不用 realPhotos（视频帧）；只用站点插画 + 各项目漫画图
    push(c.image);
    ["food", "stay", "play"].forEach((kind) => {
      (c[kind] || []).forEach((it) => push(it && it.image));
    });
    return urls;
  }

  function itemImage(it, c, used, fallbackIdx) {
    if (it && isComicUrl(it.image)) return it.image;
    const pool = photoPool(c);
    for (let k = 0; k < pool.length; k++) {
      const u = pool[(fallbackIdx + k) % pool.length];
      if (!used.has(u)) {
        used.add(u);
        return u;
      }
    }
    if (pool.length) return pool[fallbackIdx % pool.length];
    return isComicUrl(c.image) ? c.image : "";
  }

  function dayTheme(c, dayPart) {
    const base = (c.label || c.name || "").split("·")[0].trim();
    const themes = ["初遇", "慢逛", "深入", "回味", "收官"];
    return base + " · " + (themes[Math.min(dayPart, themes.length - 1)] || "行程");
  }

  function buildSlotsForStop(c, i, dayPart, totalParts) {
    const foods = selectedItems(c.food, pick[i].food);
    const stays = selectedItems(c.stay, pick[i].stay);
    const plays = selectedItems(c.play, pick[i].play);
    const annos = c.annotations || [];
    const used = new Set();
    const place = c.name || c.label;

    const playChunk = Math.ceil(plays.length / totalParts) || 1;
    const playsToday = plays.slice(dayPart * playChunk, dayPart * playChunk + playChunk);
    const foodChunk = Math.ceil(foods.length / totalParts) || 1;
    const foodsToday = foods.slice(dayPart * foodChunk, dayPart * foodChunk + foodChunk);
    const stayToday = stays[Math.min(dayPart, Math.max(0, stays.length - 1))];
    const annoToday = annos[Math.min(dayPart, Math.max(0, annos.length - 1))];

    const slots = [];
    let imgIdx = dayPart * 3;

    // 上午 · 游玩 / 景点
    const amPlay = playsToday[0];
    const amImg = itemImage(amPlay, c, used, imgIdx++);
    slots.push({
      key: "am",
      kind: "play",
      pill: "上午",
      time: "09:00 – 12:00",
      title: amPlay ? amPlay.name : place,
      body:
        (amPlay && amPlay.note) ||
        (annoToday && (annoToday.d || annoToday.t)) ||
        (c.desc || "").slice(0, 100) ||
        c.note ||
        "",
      bullets: [
        amPlay ? "游玩 · " + amPlay.name : "打卡 · " + place,
        annoToday && annoToday.t ? annoToday.t + (annoToday.d ? "：" + annoToday.d : "") : "",
        c.note || "",
      ].filter(Boolean).slice(0, 3),
      tip: amPlay && amPlay.budget != null ? "预算约 " + yen(itemBudget(amPlay)) : (c.note || ""),
      visual: amImg,
      budget: amPlay ? itemBudget(amPlay) : 0,
      tags: amPlay ? ["游玩", amPlay.name] : ["景点"],
    });

    // 下午 · 优先第二游玩，否则美食
    const pmPlay = playsToday[1];
    const pmFood = foodsToday[0];
    if (pmPlay) {
      const img = itemImage(pmPlay, c, used, imgIdx++);
      slots.push({
        key: "pm",
        kind: "play",
        pill: "下午",
        time: "14:00 – 17:30",
        title: pmPlay.name,
        body: pmPlay.note || (annos[1] && annos[1].d) || "继续探索本地体验",
        bullets: [
          "游玩 · " + pmPlay.name,
          pmPlay.note || "",
          pmFood ? "顺路觅食 · " + pmFood.name : "",
        ].filter(Boolean).slice(0, 3),
        tip: pmPlay.budget != null ? "预算约 " + yen(itemBudget(pmPlay)) : "",
        visual: img,
        budget: itemBudget(pmPlay),
        tags: ["游玩", pmPlay.name],
      });
    } else if (pmFood) {
      const img = itemImage(pmFood, c, used, imgIdx++);
      const extras = foodsToday.slice(1).map((f) => f.name);
      slots.push({
        key: "pm",
        kind: "food",
        pill: "下午",
        time: "12:30 – 17:00",
        title: pmFood.name,
        body: [pmFood.note, extras.length ? "还可尝尝：" + extras.join("、") : ""]
          .filter(Boolean)
          .join(" · ") || "尝尝当地味道，别赶场",
        bullets: [
          "美食 · " + pmFood.name,
          pmFood.note || "",
          pmFood.budget != null ? "人均约 " + yen(itemBudget(pmFood)) : "",
        ].filter(Boolean),
        tip: "推荐美食，已计入花费",
        visual: img,
        budget: itemBudget(pmFood),
        tags: ["美食", pmFood.name].concat(extras.slice(0, 2)),
      });
    } else {
      const img = itemImage(null, c, used, imgIdx++);
      slots.push({
        key: "pm",
        kind: "free",
        pill: "下午",
        time: "14:00 – 17:30",
        title: (c.label || place) + " · 漫步",
        body: c.note || "留白给偶遇与拍照，不必排满",
        bullets: ["自由活动", c.note || "随性走走"].filter(Boolean),
        tip: "",
        visual: img,
        budget: 0,
        tags: ["自由活动"],
      });
    }

    // 晚上 · 住宿为主，可带晚餐
    const eveFood =
      foodsToday.length > (pmPlay ? 0 : 1)
        ? foodsToday[pmPlay ? 0 : Math.min(1, foodsToday.length - 1)]
        : foodsToday[0];
    if (stayToday) {
      const img = itemImage(stayToday, c, used, imgIdx++);
      const bullets = [
        "住宿 · " + stayToday.name,
        stayToday.nights ? "入住 " + stayToday.nights + " 晚" : "",
        stayToday.note || "",
        eveFood && (!pmFood || eveFood.name !== pmFood.name)
          ? "晚餐 · " + eveFood.name
          : "",
      ].filter(Boolean);
      slots.push({
        key: "eve",
        kind: "stay",
        pill: "晚上",
        time: "19:00 – 21:30",
        title:
          stayToday.name + (stayToday.nights ? ` · ${stayToday.nights}晚` : ""),
        body:
          stayToday.note ||
          (eveFood ? "晚餐：" + eveFood.name : "回住所休整，整理明日行程"),
        bullets,
        tip:
          stayToday.budget != null
            ? "住宿预算约 " + yen(itemBudget(stayToday))
            : "早点休息，养足体力",
        visual: img,
        sideVisual:
          eveFood && (!pmFood || eveFood.name !== pmFood.name)
            ? itemImage(eveFood, c, used, imgIdx++)
            : "",
        sideLabel: eveFood ? eveFood.name : "",
        budget: itemBudget(stayToday),
        tags: ["住宿"].concat(
          eveFood && (!pmFood || eveFood.name !== pmFood.name)
            ? ["美食", eveFood.name]
            : []
        ),
      });
    } else if (eveFood) {
      const img = itemImage(eveFood, c, used, imgIdx++);
      slots.push({
        key: "eve",
        kind: "food",
        pill: "晚上",
        time: "19:00 – 21:30",
        title: "晚餐 · " + eveFood.name,
        body: eveFood.note || "结束一天，用一顿本地餐收尾",
        bullets: ["美食 · " + eveFood.name, eveFood.note || ""].filter(Boolean),
        tip: eveFood.budget != null ? "人均约 " + yen(itemBudget(eveFood)) : "",
        visual: img,
        budget: itemBudget(eveFood),
        tags: ["美食", eveFood.name],
      });
    } else {
      const img = itemImage(null, c, used, imgIdx++);
      slots.push({
        key: "eve",
        kind: "free",
        pill: "晚上",
        time: "19:00 – 21:30",
        title: "夜色漫步",
        body: "轻松收尾，为第二天留体力",
        bullets: ["自由活动"],
        tip: "",
        visual: img,
        budget: 0,
        tags: ["自由活动"],
      });
    }

    // 图库：当日所有独特配图（含美食/住宿）
    const gallery = [];
    const pushGal = (src, label, kind) => {
      if (!isComicUrl(src)) return;
      if (gallery.some((g) => g.src === src && g.label === label)) return;
      gallery.push({ src, label, kind: kind || "" });
    };
    slots.forEach((s, n) => {
      pushGal(s.visual, s.title, s.kind);
      if (s.sideVisual) pushGal(s.sideVisual, s.sideLabel || "美食", "food");
    });
    foodsToday.forEach((f) => {
      if (f.image) pushGal(f.image, f.name, "food");
    });
    if (stayToday && stayToday.image)
      pushGal(stayToday.image, stayToday.name, "stay");

    return {
      theme: dayTheme(c, dayPart),
      place,
      label: c.label || place,
      tip: c.note || "",
      image: c.image || "",
      i,
      x: c.x,
      y: c.y,
      flow: slots.map((s) => s.title),
      slots,
      gallery,
      foods: foodsToday.map((f) => f.name),
      stays: stayToday
        ? [stayToday.name + (stayToday.nights ? ` · ${stayToday.nights}晚` : "")]
        : [],
      plays: playsToday.map((p) => p.name),
      packing: (c.packing || [])
        .filter((_, j) => pick[i].pack[j])
        .map((x) => (typeof x === "string" ? x : x.name))
        .slice(0, 4),
    };
  }

  function buildDayPlan(ordered, dayInfo) {
    const days = [];
    for (let d = 0; d < dayInfo.days; d++) {
      days.push({ day: d + 1, stops: [], items: [] });
    }
    let cursor = 0;
    ordered.forEach(({ c, i }) => {
      const weight = Math.max(1, Math.ceil(Number(c.daysSuggest) || 1));
      for (let p = 0; p < weight; p++) {
        const slot = Math.min(cursor + p, dayInfo.days - 1);
        const built = buildSlotsForStop(c, i, p, weight);
        days[slot].stops.push(built);
        // keep legacy items for map/compat
        days[slot].items.push({
          name: built.place,
          foods: built.foods,
          stays: built.stays,
          plays: built.plays,
          tip: built.tip,
          x: built.x,
          y: built.y,
          i: built.i,
        });
      }
      cursor += weight;
      if (cursor > dayInfo.days - 1) cursor = dayInfo.days - 1;
    });
    return days.filter((d) => d.stops.length);
  }

  function refreshCash() {
    const { total } = calcTotal();
    const el = document.getElementById("tvCashNum");
    if (el) el.textContent = yen(total);
  }

    document.getElementById("tvDrawerSub").textContent = sub || "";
    document.getElementById("tvDrawerBody").innerHTML = html;

    document.getElementById("tvDrawerMask").classList.remove("on");

  function openCashDrawer() {
    const { total, lines } = calcTotal();

      '<div class="tv-sum">预计花费合计 <b>' +
      yen(total) +

      html += '<p class="tv-hint">还没有勾选任何付费项目，去地点详情里选选看～</p>';

  function packIconFor(name) {
    const n = String(name || "");
    const base =
      (D.overview && D.overview.packIconBase) || "media/bali/pack/";
    const hit = (keys) => keys.some((k) => n.includes(k));
    let file = "jacket.png";
    if (hit(["手套"])) file = "gloves.png";
    else if (hit(["头灯"])) file = "lamp.png";
    else if (hit(["面具", "口罩"])) file = "mask.png";
    else if (hit(["登山鞋", "浮潜"])) file = "boots.png";
    else if (hit(["现金", "盾"])) file = "cash.png";
    else if (hit(["泳衣", "泳"])) file = "swim.png";
    else if (hit(["防晒", "SPF"])) file = "sunscreen.png";
    else if (hit(["防水手机", "手机袋"])) file = "drybag.png";
    else if (hit(["防水袋", "防水"])) file = "drybag.png";
    else if (hit(["拖鞋"])) file = "sneakers.png";
    else if (hit(["墨镜"])) file = "glasses.png";
    else if (hit(["驱蚊"])) file = "mosquito.png";
    else if (hit(["运动鞋", "鞋"])) file = "sneakers.png";
    else if (hit(["瑜伽", "速干", "薄长袖", "长袖", "湿巾", "夜店", "穿搭"]))
      file = "jacket.png";
    else if (hit(["冲锋", "外套", "夹克"])) file = "jacket.png";
    else if (hit(["充电宝", "电源"])) file = "power.png";
    else if (hit(["帽"])) file = "hat.png";
    else if (hit(["药", "晕"])) file = "meds.png";
    else if (hit(["护照"])) file = "passport.png";
    return base + file;
  }

  function collectPackItems() {
    const map = {};
    selectedStops().forEach(({ c, i }) => {
      (c.packing || []).forEach((raw, j) => {
        const name = typeof raw === "string" ? raw : raw.name;
        const img =
          (typeof raw === "object" && raw.image) || packIconFor(name);
        if (!map[name]) {
          map[name] = { name, on: false, refs: [], image: img };
        }
        map[name].refs.push({ i, j });
        if (pick[i].pack[j]) map[name].on = true;
      });
    });
    return Object.keys(map)
      .sort()
      .map((k) => map[k]);
  }

  function setPackItemOn(item, on) {
    item.refs.forEach(({ i, j }) => {
      pick[i].pack[j] = on;
    });
    item.on = on;
  }

  function packFillRatio(items) {
    if (!items.length) return 0;
    const on = items.filter((x) => x.on).length;
    return on / items.length;
  }

  function applySuitcaseWeight(stage, ratio) {
    if (!stage) return;
    stage.classList.remove("w0", "w1", "w2", "w3");
    const lvl = ratio < 0.25 ? 0 : ratio < 0.5 ? 1 : ratio < 0.75 ? 2 : 3;
    stage.classList.add("w" + lvl);
    const label = stage.querySelector(".tv-bag-weight");
    if (label) {
      label.textContent =
        lvl === 0
          ? "轻装上阵"
          : lvl === 1
          ? "刚刚好"
          : lvl === 2
          ? "有点沉了"
          : "越来越慢…箱子很沉";
    }
  }

  function flyPackGhost(fromEl, toEl, imgSrc, mode) {
    if (!fromEl || !toEl) return;
    const a = fromEl.getBoundingClientRect();
    const b = toEl.getBoundingClientRect();
    const ghost = document.createElement("div");
    ghost.className = "tv-pack-ghost " + (mode || "in");
    ghost.innerHTML = '<img src="' + esc(imgSrc) + '" alt="">';
    document.body.appendChild(ghost);
    const startX = a.left + a.width / 2;
    const startY = a.top + a.height / 2;
    const endX = b.left + b.width / 2;
    const endY = b.top + b.height / 2;
    if (mode === "out") {
      ghost.style.left = endX + "px";
      ghost.style.top = endY + "px";
      ghost.style.transform = "translate(-50%,-50%) scale(.55)";
      ghost.style.opacity = "1";
      requestAnimationFrame(() => {
        ghost.style.left = startX + "px";
        ghost.style.top = startY - 40 + "px";
        ghost.style.transform = "translate(-50%,-50%) scale(1) rotate(-12deg)";
        ghost.style.opacity = "0";
      });
    } else {
      ghost.style.left = startX + "px";
      ghost.style.top = startY + "px";
      ghost.style.transform = "translate(-50%,-50%) scale(1)";
      ghost.style.opacity = "1";
      requestAnimationFrame(() => {
        ghost.style.left = endX + "px";
        ghost.style.top = endY + "px";
        ghost.style.transform = "translate(-50%,-50%) scale(.45)";
        ghost.style.opacity = "0.15";
      });
    }
    setTimeout(() => ghost.remove(), 620);
  }

  function smoothPath(pts) {
    if (!pts.length) return "";
    if (pts.length === 1) return "M " + pts[0][0] + " " + pts[0][1];
    if (pts.length === 2) {
      return (
        "M " +
        pts[0][0] +
        " " +
        pts[0][1] +
        " L " +
        pts[1][0] +
        " " +
        pts[1][1]
      );
    }
    // Catmull-Rom → cubic Bezier（沿途顺序平滑，不往地图中心乱折）
    let d = "M " + pts[0][0] + " " + pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d +=
        " C " +
        cp1x +
        " " +
        cp1y +
        " " +
        cp2x +
        " " +
        cp2y +
        " " +
        p2[0] +
        " " +
        p2[1];
    }
    return d;
  }

  function drawRoute(ordered, opts) {
    const svg = document.getElementById("tvRouteSvg");
    const pins = document.getElementById("tvMapPins");
    const legend = document.getElementById("tvMapLegend");
    if (!svg || !pins) return;
    pins.innerHTML = "";
    svg.innerHTML = "";
    if (legend) legend.innerHTML = "";

    const overlay = !opts || opts.overlay !== false;

    ordered.forEach(({ c }, n) => {
      if (overlay) {
        const p = document.createElement("div");
        p.className = "tv-map-pin";
        p.style.left = (c.x || 50) + "%";
        p.style.top = (c.y || 50) + "%";
        p.innerHTML = '<span class="tv-map-num">' + (n + 1) + "</span>";
        pins.appendChild(p);
      }
      if (legend) {
        legend.innerHTML +=
          '<span class="tv-leg-item"><i>' +
          (n + 1) +
          "</i>" +
          esc(c.label || c.name) +
          "</span>";
      }
    });

    if (!overlay) return;

    const pts = ordered.map(({ c }) => [
      Number(c.x) || 50,
      Number(c.y) || 50,
    ]);
    const d = smoothPath(pts);
    svg.innerHTML =
      '<defs><marker id="tvArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">' +
      '<path d="M 1 1 L 9 5 L 1 9 z" fill="var(--accent)" opacity=".85"/></marker></defs>' +
      (d
        ? '<path class="tv-route-soft" d="' +
          d +
          '" fill="none"/>' +
          '<path class="tv-route-line" d="' +
          d +
          '" fill="none" marker-end="url(#tvArrow)"/>'
        : "");
  }

  // ---- hook openDetail ----
  const _open = window.openDetail;
  window.openDetail = function (i) {
    if (typeof _open === "function") _open(i);
    setTimeout(() => renderTravelPanel(i), 0);
  };

  ensureChrome();
  refreshCash();
  document.body.classList.add("travel-mode");
})();

</script>
</body>
</html>
